services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: ${CADENCE_POSTGRES_DB:-cadence}
      POSTGRES_USER: ${CADENCE_POSTGRES_USER:-cadence}
      POSTGRES_PASSWORD: ${CADENCE_POSTGRES_PASSWORD:-cadence-local-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cadence-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      CADENCE_DATABASE_URL: ${CADENCE_COMPOSE_DATABASE_URL:-postgresql+psycopg://${CADENCE_POSTGRES_USER:-cadence}:${CADENCE_POSTGRES_PASSWORD:-cadence-local-password}@db:5432/${CADENCE_POSTGRES_DB:-cadence}}
      # Compose runs the app inside its own network. Keep migrations on the
      # db service hostname even when .env contains host-side localhost URLs.
      CADENCE_MIGRATION_DATABASE_URL: ${CADENCE_COMPOSE_MIGRATION_DATABASE_URL:-${CADENCE_COMPOSE_DATABASE_URL:-postgresql+psycopg://${CADENCE_POSTGRES_USER:-cadence}:${CADENCE_POSTGRES_PASSWORD:-cadence-local-password}@db:5432/${CADENCE_POSTGRES_DB:-cadence}}}
      CADENCE_SERVE_FRONTEND: "true"
      CADENCE_FRONTEND_BASE_URL: ${CADENCE_FRONTEND_BASE_URL:-http://localhost:8000}
      CADENCE_CORS_ORIGINS: ${CADENCE_CORS_ORIGINS:-http://localhost:8000}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - cadence-backups:/app/cadence/data/backups
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  cadence-backups:
  cadence-postgres:
