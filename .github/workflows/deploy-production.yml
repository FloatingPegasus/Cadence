name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cadence-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cadence.kanishq.dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      CADENCE_SECRET_KEY: ${{ secrets.CADENCE_SECRET_KEY }}
      CADENCE_BREVO_API_KEY: ${{ secrets.CADENCE_BREVO_API_KEY }}
      CADENCE_AI_API_KEY: ${{ secrets.CADENCE_AI_API_KEY }}
      CADENCE_DATABASE_URL: ${{ vars.CADENCE_DATABASE_URL }}
      CADENCE_BACKUP_DIR: ${{ vars.CADENCE_BACKUP_DIR }}
      CADENCE_RUNTIME_LOCK_PATH: ${{ vars.CADENCE_RUNTIME_LOCK_PATH }}
      CADENCE_FRONTEND_BASE_URL: ${{ vars.CADENCE_FRONTEND_BASE_URL }}
      CADENCE_CORS_ORIGINS: ${{ vars.CADENCE_CORS_ORIGINS }}
      CADENCE_SERVE_FRONTEND: ${{ vars.CADENCE_SERVE_FRONTEND }}
      CADENCE_TEST_MODE: ${{ vars.CADENCE_TEST_MODE }}
      CADENCE_DEV_MODE: ${{ vars.CADENCE_DEV_MODE }}
      CADENCE_AI_ENABLED: ${{ vars.CADENCE_AI_ENABLED }}
      CADENCE_AI_PROVIDER: ${{ vars.CADENCE_AI_PROVIDER }}
      CADENCE_AI_BASE_URL: ${{ vars.CADENCE_AI_BASE_URL }}
      CADENCE_AI_CATALOG_REFRESH_MINUTES: ${{ vars.CADENCE_AI_CATALOG_REFRESH_MINUTES }}
      CADENCE_AI_REQUEST_TIMEOUT_SECONDS: ${{ vars.CADENCE_AI_REQUEST_TIMEOUT_SECONDS }}
      CADENCE_FROM_EMAIL: ${{ vars.CADENCE_FROM_EMAIL }}
      CADENCE_FROM_NAME: ${{ vars.CADENCE_FROM_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate required deployment configuration
        run: |
          test -n "$FLY_API_TOKEN"
          test -n "$CADENCE_SECRET_KEY"
          test -n "$CADENCE_DATABASE_URL"
          test -n "$CADENCE_FRONTEND_BASE_URL"
          test -n "$CADENCE_CORS_ORIGINS"
          test -n "$CADENCE_FROM_EMAIL"
          test -n "$CADENCE_BREVO_API_KEY"
          if [ "$CADENCE_AI_ENABLED" = "true" ]; then
            test -n "$CADENCE_AI_API_KEY"
          fi
      - name: Configure runtime secrets and variables
        run: |
          flyctl secrets set \
            CADENCE_SECRET_KEY="$CADENCE_SECRET_KEY" \
            CADENCE_BREVO_API_KEY="$CADENCE_BREVO_API_KEY" \
            CADENCE_AI_API_KEY="$CADENCE_AI_API_KEY" \
            CADENCE_DATABASE_URL="$CADENCE_DATABASE_URL" \
            CADENCE_BACKUP_DIR="$CADENCE_BACKUP_DIR" \
            CADENCE_RUNTIME_LOCK_PATH="$CADENCE_RUNTIME_LOCK_PATH" \
            CADENCE_FRONTEND_BASE_URL="$CADENCE_FRONTEND_BASE_URL" \
            CADENCE_CORS_ORIGINS="$CADENCE_CORS_ORIGINS" \
            CADENCE_SERVE_FRONTEND="$CADENCE_SERVE_FRONTEND" \
            CADENCE_TEST_MODE="$CADENCE_TEST_MODE" \
            CADENCE_DEV_MODE="$CADENCE_DEV_MODE" \
            CADENCE_AI_ENABLED="$CADENCE_AI_ENABLED" \
            CADENCE_AI_PROVIDER="$CADENCE_AI_PROVIDER" \
            CADENCE_AI_BASE_URL="$CADENCE_AI_BASE_URL" \
            CADENCE_AI_CATALOG_REFRESH_MINUTES="$CADENCE_AI_CATALOG_REFRESH_MINUTES" \
            CADENCE_AI_REQUEST_TIMEOUT_SECONDS="$CADENCE_AI_REQUEST_TIMEOUT_SECONDS" \
            CADENCE_FROM_EMAIL="$CADENCE_FROM_EMAIL" \
            CADENCE_FROM_NAME="$CADENCE_FROM_NAME"
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config fly.toml
