name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      CADENCE_TEST_MODE: "true"
      CADENCE_DEV_MODE: "false"
      CADENCE_SECRET_KEY: ci-only-secret-not-for-production
      CADENCE_DATABASE_URL: sqlite+aiosqlite:////tmp/cadence-ci.db
      CADENCE_RUNTIME_LOCK_PATH: /tmp/cadence-ci.lock
      CADENCE_BACKUP_DIR: /tmp/cadence-ci-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: cadence/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r cadence/requirements.txt
      - name: Apply migrations
        run: alembic -c cadence/alembic.ini upgrade head
      - name: Verify migration state
        run: alembic -c cadence/alembic.ini check
      - name: Run backend tests
        run: python -m unittest discover -s cadence/tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install frontend dependencies
        working-directory: front
        run: npm ci
      - name: Typecheck, test, and build
        working-directory: front
        run: npm run check
