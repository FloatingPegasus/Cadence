name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: cadence_test
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadence -d cadence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CADENCE_TEST_MODE: "true"
      CADENCE_DEV_MODE: "false"
      CADENCE_DATABASE_URL: postgresql+psycopg://cadence:cadence-test-password@localhost:5432/cadence_test
      CADENCE_TEST_DATABASE_URL: postgresql+psycopg://cadence:cadence-test-password@localhost:5432/cadence_test
      CADENCE_MIGRATION_DATABASE_URL: postgresql+psycopg://cadence:cadence-test-password@localhost:5432/cadence_test
      CADENCE_INTEGRATION_ADMIN_DATABASE_URL: postgresql+psycopg://cadence:cadence-test-password@localhost:5432/postgres
      CADENCE_RUN_INTEGRATION: "true"
      CADENCE_BACKUP_DIR: /tmp/cadence-ci-backups
      CADENCE_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: cadence/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r cadence/requirements.txt
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo \"$VERSION_CODENAME\")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
      - name: Verify PostgreSQL client version
        run: |
          pg_dump --version
          test "$(pg_dump --version | sed -E 's/.* ([0-9]+)\..*/\1/')" = "17"
      - name: Apply migrations
        run: alembic -c cadence/alembic.ini upgrade head
      - name: Verify migration state
        run: alembic -c cadence/alembic.ini check
      - name: Check Python syntax
        run: python -m compileall -q cadence
      - name: Run API readiness smoke
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient

          from cadence.app import app

          with TestClient(app) as client:
              response = client.get("/healthz")
              assert response.status_code == 200, response.text
              assert response.json() == {"status": "ok"}
          PY
      - name: Run backend tests
        env:
          CADENCE_RUN_INTEGRATION: "false"
        run: python -m unittest discover -s cadence/tests -v
      - name: Run PostgreSQL integration tests
        run: python -m unittest discover -s cadence/tests/integration -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install frontend dependencies
        working-directory: front
        run: npm ci
      - name: Typecheck, test, and build
        working-directory: front
        run: npm run check

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build application image
        run: docker build --tag cadence:ci .

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: cadence/requirements.txt
      - name: Audit Python dependencies and source
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1 bandit==1.9.4
          pip-audit -r cadence/requirements.txt
          bandit -r cadence -x cadence/tests,cadence/app/persistence/migrations
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Audit frontend dependencies
        working-directory: front
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
