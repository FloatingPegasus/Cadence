# Dependabot cannot use two schedules for the same folder.
# Weekly checks still run. Patch/minor land in one PR. Majors land in a
# separate PR, and only after ~30 days on the registry (security updates
# skip that wait).
version: 2
updates:
  - package-ecosystem: pip
    directory: /cadence
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 30
    groups:
      python-patches:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      python-majors:
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 30
    groups:
      javascript-patches:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      javascript-majors:
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 30
    groups:
      github-actions-patches:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-majors:
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 30
    groups:
      docker-patches:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      docker-majors:
        patterns:
          - "*"
        update-types:
          - major
