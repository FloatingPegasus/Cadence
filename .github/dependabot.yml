version: 2
updates:
  - package-ecosystem: pip
    directory: /cadence
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      javascript:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns:
          - "*"
