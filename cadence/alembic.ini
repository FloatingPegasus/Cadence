# Cadence uses PostgreSQL with psycopg. env.py selects the URL from
# CADENCE_MIGRATION_DATABASE_URL or CADENCE_DATABASE_URL.

[alembic]
script_location = %(here)s/app/persistence/migrations

prepend_sys_path = .

path_separator = os
sqlalchemy.url = postgresql+psycopg://cadence:cadence-local-password@localhost:5432/cadence

# Logging is consumed by env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
